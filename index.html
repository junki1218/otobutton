<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>おとボタン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== スタート画面 ========== -->
<section id="screen-start" class="screen is-active">
  <div class="start-inner">
    <h1 class="title">
      <img class="title-logo" src="assets/icons/ui_logo.png" alt="" onerror="this.hidden=true">
      <span class="title-text">おとボタン</span>
    </h1>
    <button id="btn-go-main" class="big-btn big-btn--go" type="button">
      <img class="big-btn__icon" src="assets/icons/ui_play.png" alt="" onerror="this.hidden=true">
      <span>はじめる</span>
    </button>
    <button id="btn-go-settings" class="big-btn big-btn--sub" type="button">
      <img class="big-btn__icon" src="assets/icons/ui_gear.png" alt="" onerror="this.hidden=true">
      <span>せってい</span>
    </button>
  </div>
</section>

<!-- ========== メイン画面 ========== -->
<section id="screen-main" class="screen">
  <div id="button-grid" class="grid"></div>
  <div class="toolbar">
    <button id="btn-stop-all" class="tool tool--stop" type="button">
      <img class="tool__icon" src="assets/icons/ui_stop_all.png" alt="" onerror="this.hidden=true">
      <span>ぜんぶとめる</span>
    </button>
    <div class="tool tool--volume">
      <span class="tool__label">おとの おおきさ</span>
      <input id="master-volume" type="range" min="0" max="100" step="5" value="80">
      <button id="btn-unlock-volume" class="lock-btn" type="button"
              aria-label="おとの おおきさの かぎを あける">かぎ</button>
    </div>
    <button id="btn-open-settings" class="tool tool--gear" type="button" aria-label="せってい">
      <img class="tool__icon" src="assets/icons/ui_gear.png" alt="" onerror="this.hidden=true">
      <span>せってい</span>
    </button>
    <button id="btn-back-start" class="tool" type="button">もどる</button>
  </div>
</section>

<!-- ========== 設定画面 ========== -->
<section id="screen-settings" class="screen">
  <header class="set-head">
    <h2>せってい</h2>
    <button id="btn-settings-done" class="set-done" type="button">できた</button>
  </header>

  <div class="set-body">
    <div class="set-block">
      <h3>ぜんたい</h3>
      <div class="set-row">
        <label for="set-columns">よこに ならべる かず</label>
        <select id="set-columns"></select>
      </div>
      <div class="set-row">
        <label for="set-reduce-motion">うごきを へらす</label>
        <input id="set-reduce-motion" type="checkbox">
      </div>
      <div class="set-row">
        <label for="set-lock-volume">おとの おおきさに かぎを かける</label>
        <input id="set-lock-volume" type="checkbox">
      </div>
      <div class="set-row">
        <label>あんしょう ばんごう（4けた）</label>
        <span><input id="set-pin" type="text" inputmode="numeric" maxlength="4" size="4"> <button id="btn-save-pin" type="button" class="mini-btn">かえる</button></span>
      </div>
      <div class="set-row">
        <label>せっていの もちだし</label>
        <span>
          <button id="btn-export" type="button" class="mini-btn">かきだす</button>
          <button id="btn-import" type="button" class="mini-btn">よみこむ</button>
          <input id="file-import" type="file" accept="application/json,.json" hidden>
        </span>
      </div>
      <!-- ボタンの「ファイルから」で使う。iPad では「ファイル」や「ミュージック」が開く -->
      <input id="file-sound" type="file" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.caf" hidden>
      <div class="set-row">
        <label>じぶんの おんがく</label>
        <span id="local-sound-status" class="hint"></span>
      </div>
      <div class="set-row set-row--block">
        <label>この きかいに いれた おと</label>
        <div id="user-sound-list" class="sound-list"></div>
        <span id="user-sound-status" class="hint"></span>
      </div>
    </div>

    <div class="set-block">
      <h3>ボタン <span id="button-count-label"></span></h3>
      <div id="button-editor"></div>
      <button id="btn-add-button" type="button" class="mini-btn mini-btn--add">＋ ボタンを ふやす</button>
    </div>
  </div>
</section>

<!-- ========== 暗証番号 ========== -->
<div id="pin-dialog" class="overlay" hidden>
  <div class="pin-box">
    <p class="pin-msg">あんしょう ばんごうを いれてください</p>
    <div id="pin-dots" class="pin-dots"></div>
    <div class="pin-pad">
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
      <button type="button" data-key="back">←</button><button type="button" data-key="0">0</button><button type="button" data-key="cancel">やめる</button>
    </div>
    <p id="pin-error" class="pin-error" hidden>ちがいます</p>
  </div>
</div>

<script src="js/userSounds.js"></script>
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
